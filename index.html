
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قیمت لحظه‌ای تتر</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:tahoma;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.card {
  background:#1e293b;
  padding:35px;
  border-radius:20px;
  text-align:center;
  width:300px;
}
#price {
  font-size:40px;
  color:#22c55e;
  font-weight:bold;
  direction:ltr;
  margin:25px 0;
}
#status {color:#94a3b8;font-size:12px}
</style>
</head>
<body>

<div class="card">
  <h2>قیمت لحظه‌ای تتر</h2>
  <div id="price">293</div>
  <div id="status">قیمت اولیه دریافت شد</div>
</div>

<script>
const API =
"https://api1.tabdeal.org/r/api/v1/depth?symbol=USDTIRT";

async function updatePrice() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(API, {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    const value = data.asks[0][0];

    document.getElementById("price").textContent =
      Number(value).toLocaleString("en-US");

    status.textContent =
      "آخرین بروزرسانی: " +
      new Date().toLocaleTimeString("fa-IR");

  } catch (error) {
    status.textContent = "بروزرسانی ناموفق؛ قیمت قبلی حفظ شد";
    console.error(error);
  }
}

updatePrice();
setInterval(updatePrice, 5000);
</script>

</body>
</html>
